plugins {
    id "dev.architectury.loom" version "1.10.455"
    id "maven-publish"
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

base {
    archivesBaseName = project.archives_base_name
    version = project.mod_version + (project.hasProperty("devbuild") ? ("-" + project.findProperty("devbuild")) : "")
    group = project.maven_group
}

repositories {
    maven { url = uri("gradle/local-maven") }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
    }
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases/"
    }
    maven {
        name = "meteor-maven"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "meteor-maven-snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
    maven {
        name = "modrinth"
        url = "https://api.modrinth.com/maven"

        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "vram"
        url = "https://maven.vram.io//"
    }
    maven {
        name = "ViaVersion"
        url = "https://repo.viaversion.com"
    }
    mavenCentral()
}

configurations {
    // include mods
    modImplementation.extendsFrom(modInclude)
    include.extendsFrom(modInclude)

    // include libraries
    implementation.extendsFrom(library)
    runtimeOnly.extendsFrom(library)
    forgeRuntimeLibrary.extendsFrom(library)
    shadow.extendsFrom(library)
}

dependencies {
    // Minecraft / NeoForge. Architectury Loom remaps the Yarn-named Meteor
    // sources to the Mojang names used by NeoForge at runtime.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:meteor-yarn:1.21.1+build.3-meteor.1:v2"
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"

    // Temporary compile-only bridge for the few loader APIs still being ported.
    // It is not packaged in the NeoForge jar.
    compileOnly "net.fabricmc:fabric-loader:0.15.11"

    // Compat fixes
    modCompileOnly("maven.modrinth:lithium:${project.lithium_version}") { transitive = false }
    modCompileOnly("maven.modrinth:iris:${project.iris_version}") { transitive = false }
    //modCompileOnly("io.vram:canvas-fabric-mc119:1.0.+") { transitive = false } // TODO: 1.19.3
    modCompileOnly("de.florianmichael:ViaFabricPlus:${project.viafabricplus_version}") { transitive = false }

    // Official NeoForge Baritone API for Minecraft 1.21/1.21.1.
    // The standalone NeoForge Baritone jar remains an optional runtime mod.
    modImplementation files("libs/baritone-unoptimized-neoforge-1.11.2.jar")

    // Libraries
    library "meteordevelopment:orbit:${project.orbit_version}"
    library "meteordevelopment:starscript:${project.starscript_version}"
    library "meteordevelopment:discord-ipc:${project.discordipc_version}"
    library "org.reflections:reflections:${project.reflections_version}"
    library("io.netty:netty-handler-proxy:${project.netty_version}") { transitive = false }
    library("io.netty:netty-codec-socks:${project.netty_version}") { transitive = false }
    library "de.florianmichael:WaybackAuthLib:${project.waybackauthlib_version}"

}

sourceSets.main.java.exclude("meteordevelopment/meteorclient/mixin/indigo/**")
sourceSets.main.java.exclude("meteordevelopment/meteorclient/mixin/indium/**")
sourceSets.main.java.exclude("meteordevelopment/meteorclient/mixin/sodium/**")

loom {
    accessWidenerPath = file("src/main/resources/meteor-client.accesswidener")
}

afterEvaluate {
    migrateMappings.configure {
        outputDir = project.file("src/main/java")
    }
}

tasks {
    processResources {
        def propertyMap = [
            "version"          : project.version,
            "devbuild"         : project.findProperty("devbuild") ?: "",
            "commit"           : project.findProperty("commit") ?: "",
            "minecraft_version": project.minecraft_version,
            "loader_version"   : project.loader_version
        ]

        inputs.properties(propertyMap)
        filesMatching("META-INF/neoforge.mods.toml") {
            expand(propertyMap)
        }
    }

    jar {
        from("LICENSE") {
            rename { "${it}_${project.base.archivesBaseName}" }
        }

        manifest {
            attributes("Main-Class": "meteordevelopment.meteorclient.Main")
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21

        withSourcesJar()
        withJavadocJar()
    }

    shadowJar {
        configurations = [project.configurations.shadow]

        // Annotation APIs are supplied by NeoForge/modpacks. Bundling them creates
        // split Java modules (notably with CraftPresence's jsr305 dependency).
        exclude "javax/annotation/**"

        from("LICENSE") {
            rename { "${it}_${project.base.archivesBaseName}" }
        }

        dependencies {
            exclude {
                it.moduleGroup == "org.slf4j"
            }
        }
    }

    remapJar {
        dependsOn shadowJar
        inputFile.set(shadowJar.archiveFile)
    }

    javadoc {
        options.addStringOption("Xdoclint:none", "-quiet")
        options.encoding = "UTF-8"
    }

    build {
        dependsOn javadocJar
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "meteor-client"
            version = project.hasProperty("devbuild") ? (project.mod_version + "-SNAPSHOT") : project.mod_version

            from components.java
        }
    }

    repositories {
        maven {
            name = "meteor-maven"
            url = project.hasProperty("devbuild") ? "https://maven.meteordev.org/snapshots" : "https://maven.meteordev.org/releases"

            credentials {
                username = System.getenv("MAVEN_METEOR_ALIAS")
                password = System.getenv("MAVEN_METEOR_TOKEN")
            }

            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}
